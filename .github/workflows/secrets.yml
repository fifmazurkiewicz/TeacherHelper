name: Secrets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: docker run --rm -v "${{ github.workspace }}:/src" ghcr.io/gitleaks/gitleaks:v8.28.0 detect --source=/src --verbose --redact --config=/src/.gitleaks.toml --gitleaks-ignore-path=/src/.gitleaksignore
